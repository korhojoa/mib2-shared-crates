[workspace]
resolver = "2"
members = [
    "aawg-creds",
    "btsvc-core",
    "display-manager-control",
    "dm-gles-window",
    "extender-settings",
    "file-checksum",
    "h264-ts-mux",
    "mpe-encoder-state",
